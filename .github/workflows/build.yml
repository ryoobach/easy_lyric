name: Build Easy Lyric

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build x64 Release
        run: msbuild EasyLyric.sln /m /p:Configuration=Release /p:Platform=x64 /p:RestorePackages=false

      - name: Prepare portable folder
        shell: pwsh
        run: |
          $out = "dist/Easy-Lyric-x64"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item "src/EasyLyric/bin/Release/*" $out -Recurse -Force
          Copy-Item "README.md" $out -Force

      - name: Create portable ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/Easy-Lyric-x64/*" -DestinationPath "Easy-Lyric-x64.zip" -Force

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: Easy-Lyric-x64
          path: Easy-Lyric-x64.zip
          retention-days: 14
